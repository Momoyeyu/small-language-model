<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="small-language-model logo: three stacked blocks forming a tiny transformer layer inside a rounded badge, next to the words small-language-model">
	<defs>
		<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#5b8def"/>
			<stop offset="1" stop-color="#8b5cf6"/>
		</linearGradient>
	</defs>
	<style>
		.word { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 52px; fill: #2b2b2b; }
		.sub { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #6b7684; }
		@media (prefers-color-scheme: dark) {
			.word { fill: #e6e6e6; }
			.sub { fill: #9aa5b1; }
		}
	</style>

	<!-- badge -->
	<rect x="30" y="30" width="140" height="140" rx="32" fill="url(#g)"/>
	<!-- residual stream -->
	<path d="M100,150 L100,50" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
	<!-- stacked blocks: norm / attention / ffn -->
	<rect x="62" y="122" width="76" height="16" rx="6" fill="#ffffff" opacity="0.75"/>
	<rect x="56" y="92" width="88" height="22" rx="7" fill="#ffffff"/>
	<rect x="62" y="68" width="76" height="16" rx="6" fill="#ffffff" opacity="0.75"/>
	<circle cx="100" cy="50" r="9" fill="#ffd166"/>

	<text x="196" y="108" class="word">small-language-model</text>
	<text x="199" y="146" class="sub">Not a model. LLM techniques, built from zero, line by line.</text>
</svg>
